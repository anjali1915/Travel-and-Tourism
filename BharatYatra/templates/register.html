<!doctype html>
<html>
    <head>
        <title>Register Page</title>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=Edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/register.css">
    </head>
    <body>
        <div class="box">
            <img src="/static/scene1.jpeg" alt="scene" class="background">
            <h1> Registeration</h1>
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
            {% if messages %}
            <ul>
            {% for message in messages %}
            <li>{{message}} </li>
            {% endfor %}
            </ul>
            {% endif %}
            <div class="row">
            <div class="column">
                <label for="fullname">Full Name:</label>
                <input type="text" id="name" name="fullname" placeholder="Enter your complete name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="@gmail.com" required>
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" placeholder="Password" required> 
                <span>Gender:</span>
                <input type="radio" id="male" value="Male" name="gender"><label for="male">Male</label>
                <input type="radio" id="female" value="Female" name="gender"><label for="female">Female</label>
                <input type="radio" id="other" value="Other" name="gender"><label for="other">Other</label>  
            </div>
            <div class="column">
                <label for="username">Userame:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                <label for="phone">Phone:</label>
                <input type="number" id="phone" name="phone" placeholder="Enter your number" required>
                <label for="confirm_password">Confirm Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Password" required>
            </div>
            </div>
            <div>
                <input type="submit" value="Register">
            </div>
        </form>
        </div>
    </body>
</html>
