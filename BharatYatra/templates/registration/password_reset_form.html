<!doctype html>
<html>
    <head>
        <title>Password Reset Form</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                font-family: Arial,  sans-serif;
            }
            .box {
                width: 300px;
                height: 250px;
                margin-left: 500px;
                margin-top: 200px;
                padding: 40px;
                background: rgba(255, 255, 255, 0.8);
                border-radius: 8px;
                box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.2);
                text-align: center;
            }
            body {
                padding: 40px;
            }
            img {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                filter: blur(6px);
                z-index: -1;
            }
            button {
                width: 200px;
                padding: 10px;
                background-color: #4CAF50;
                border: none;
                border-radius: 4px;
                color: white;
                font-size: 16px;
                cursor: pointer;
                margin-top: 40px;
            }
            #id_email, input[type="email"] {
                width: 200px;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 16px;
            }
            button {
                background-color: #024205;
            }
        </style>
    </head>
    <body>
    <div class="box">
        <img src="/static/scene1.jpeg" alt="scene" class="background">
        <h2 style="padding:40px;">Reset Password</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.email.label_tag }}
            {{ form.email}}
            
            <button type="submit" >Send Reset Link</button>
            
        </form>
    </div>
    </body>
</html>
