{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Page</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keywords" content="Tourism, travel">
    <meta name="description" content="Best website to travel all over the world">
    <meta name="robots" content="INDEX,FOLLOW">
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
    <!-- Background image -->
    <img src="/static/scene1.jpeg" alt="Background" class="background-image">
    

    <!-- Container for the login form -->
    <div class="container">
        <div class="login">
            <h1>Login</h1>
        </div>
        <!-- Display error messages -->
    {% if messages %}
        <ul>
        {% for message in messages %}
            <li style="color: red;">{{ message }}</li>
        {% endfor %}
        </ul>
    {% endif %}
        <form method="POST" action="{% url 'login_page' %}">
            {% csrf_token %}
            <div>
                <input type="text" name="username" placeholder="USERNAME" required>
                <span class="icon">👤</span>
            </div>
            <div>
                <input type="password" name="password" placeholder="Password" required>  
                <span class="icon">🔒</span>
            </div>
            <div>
                <label for="remember_me">Remember Me 
                    <input type="checkbox" name="remember_me">
                </label>
            </div>
            <div>
                <p>
                    <a href="{% url 'password_reset' %}">Forgot password?</a>
                </p>
                <span><input type="submit" value="LOG IN"></span>
            </div>
            <div>
                <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
            </div>
        </form>
    </div>
</body>
</html>
